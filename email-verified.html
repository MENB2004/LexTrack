<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified Successfully - LexTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .icon-container {
            width: 80px;
            height: 80px;
            background-color: #064e3b;
            border: 2px solid #059669;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 24px;
            box-shadow: 0 0 20px rgba(5, 150, 105, 0.2);
        }
        .icon {
            font-size: 40px;
            color: #34d399;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }
        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }
        .btn:hover {
            background-color: #0369a1;
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-container">
            <span class="icon">✓</span>
        </div>
        <h1>Email Verified!</h1>
        <p>Your email address has been successfully verified. You can now return to the <strong>LexTrack</strong> app and log in to manage your cases.</p>
        <a href="javascript:window.close();" class="btn">Close Window</a>
        <div class="footer">
            ⚖️ LexTrack Lawyer Case Management App
        </div>
    </div>
</body>
</html>
